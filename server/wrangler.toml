name = "union-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The relay is optional. Union works fully offline without it; a relay only
# adds store-and-forward delivery, a handle directory and shared public rooms.

[[d1_databases]]
binding = "DB"
database_name = "union-relay"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
# Comma-separated browser origins allowed to call the relay.
# Set this to your Pages origin in production, e.g.
# ALLOWED_ORIGINS = "https://originlabs1.github.io"
ALLOWED_ORIGINS = "*"

[observability]
enabled = true

[triggers]
# Daily retention: acked mail after a day, anything after 30 days.
crons = ["17 3 * * *"]
