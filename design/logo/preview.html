<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLC logo preview</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 32px; background: #F4F7FB; color: #0B1B33;
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 24px; color: #4A5B73; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font-size: 13px; color: #4A5B73; }
  .tile { background: #fff; border: 1px solid #D9E2EE; border-radius: 18px; padding: 16px; }
  .dark { background: #0A1220; border-color: #24344C; }
  .dark figcaption { color: #A9B8CC; }
  img { display: block; width: 256px; height: 256px; }
  .small img { width: 48px; height: 48px; }
</style>
</head>
<body>
  <h1>The Love Culture — logo master</h1>
  <p>First vector master built from the text description. Review the crown, the heart split and the internal sprout before locking the icon.</p>
  <div class="row">
    <figure class="tile">
      <img src="tlc-logo.svg" alt="TLC emblem on a light surface">
      <figcaption>Emblem · light surface</figcaption>
    </figure>
    <figure class="tile dark">
      <img src="tlc-logo.svg" alt="TLC emblem on a dark surface">
      <figcaption>Emblem · dark surface</figcaption>
    </figure>
    <figure class="tile">
      <img src="tlc-logo-icon.svg" alt="TLC app icon">
      <figcaption>App icon tile</figcaption>
    </figure>
    <figure class="tile small">
      <img src="tlc-logo-icon.svg" alt="TLC app icon at 48 pixels">
      <figcaption>48px check</figcaption>
    </figure>
  </div>
</body>
</html>
