name: ledger-verify

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chain:
    name: re-verify published chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: contractual behaviour of the verifier
        run: ./gradlew :tools:ledger-verify:test --console=plain

      - name: build verifier
        run: ./gradlew :tools:ledger-verify:installDist -q

      - name: verify production export (when the anchor secret exists)
        env:
          CHAIN_FILE: ${{ vars.TLC_CHAIN_EXPORT }}
          TLC_ANCHOR: ${{ vars.TLC_CHAIN_ANCHOR }}
        run: |
          BIN=./tools/ledger-verify/build/install/ledger-verify/bin/ledger-verify
          if [ -n "$CHAIN_FILE" ] && [ -f "$CHAIN_FILE" ]; then
            if [ -n "$TLC_ANCHOR" ]; then
              "$BIN" --file "$CHAIN_FILE" --anchor "$TLC_ANCHOR"
            else
              echo "! no anchor configured: prefix-only verification"
              "$BIN" --file "$CHAIN_FILE"
            fi
          else
            echo "! no production export configured yet — running invariant demo"
            "$BIN" --demo
          fi
