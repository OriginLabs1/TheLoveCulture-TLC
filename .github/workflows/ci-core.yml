name: ci-core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned binary + checksum rather than a third-party action: the gate that protects
      # every other gate must not depend on someone else's release cadence or licence.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLo /tmp/gitleaks.tar.gz "${BASE}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --verbose

  core:
    name: domain + ledger invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: verify (compile + every invariant test)
        run: ./gradlew verify --console=plain
      - name: ledger-verify demo must pass
        run: |
          ./gradlew :tools:ledger-verify:installDist -q
          ./tools/ledger-verify/build/install/ledger-verify/bin/ledger-verify --demo
      - name: publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-reports
          path: |
            core/*/build/reports/tests/test
            core/*/build/test-results/test
          if-no-files-found: warn
          retention-days: 7
