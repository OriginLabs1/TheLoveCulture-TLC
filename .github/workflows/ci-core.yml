name: ci-core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  core:
    name: domain + ledger invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: verify (compile + every invariant test)
        run: ./gradlew verify --console=plain
      - name: ledger-verify demo must pass
        run: |
          ./gradlew :tools:ledger-verify:installDist -q
          ./tools/ledger-verify/build/install/ledger-verify/bin/ledger-verify --demo
      - name: publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/*/build/reports/tests/test
            core/*/build/test-results/test
          if-no-files-found: warn
          retention-days: 7
