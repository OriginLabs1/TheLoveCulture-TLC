name: ci-android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assemble + unit + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: build debug APK
        run: ./gradlew :apps:android:assembleDebug --console=plain
      - name: unit tests
        run: ./gradlew :apps:android:testDebugUnitTest --console=plain
      - name: lint
        run: ./gradlew :apps:android:lintDebug --console=plain
      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tlc-debug-apk
          path: apps/android/build/outputs/apk/debug/*.apk
          retention-days: 7

  instrumented:
    name: emulator smoke
    # Slow and costly: main-branch and manual runs only (SPECS §B-3).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: ./gradlew :apps:android:connectedDebugAndroidTest --console=plain
