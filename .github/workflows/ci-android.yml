name: ci-android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "version.properties"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: foss assemble + unit + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          # setup-android splits this on whitespace: keep it on one line.
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6

      # The flavour split is a legal promise to F-Droid users, so it is a gate, not a convention.
      - name: FOSS guard
        run: ./scripts/check-foss.sh

      - name: build foss debug APK
        run: ./gradlew :apps:android:assembleFossDebug --console=plain

      - name: unit tests
        run: ./gradlew :apps:android:testFossDebugUnitTest --console=plain

      - name: lint
        run: ./gradlew :apps:android:lintFossDebug --console=plain

      - name: upload APK + reports
        uses: actions/upload-artifact@v7
        with:
          name: tlc-foss-debug
          path: |
            apps/android/build/outputs/apk/foss/debug/*.apk
            apps/android/build/reports/lint-results-fossDebug.html
          if-no-files-found: warn
          retention-days: 7

  instrumented:
    name: emulator smoke
    # Slow and costly: main-branch and manual runs only (SPECS §B-3).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          # setup-android splits this on whitespace: keep it on one line.
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: ./gradlew :apps:android:connectedFossDebugAndroidTest --console=plain
