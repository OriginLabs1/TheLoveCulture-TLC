name: release

# One tag, one immutable release. Every asset that reaches GitHub Releases, F-Droid and Orion
# Store is produced here from the same commit, the same version file and the same signing key.
#
#   ./scripts/bump-version.sh patch
#   git add version.properties && git commit -m "release: v0.0.1"
#   git tag v0.0.1 && git push origin main v0.0.1
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (.jks) — never committed
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# If any secret is missing the job fails before building: an unsigned release must never ship.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.0.1"
        required: true
        type: string

permissions:
  contents: write       # create the release and upload assets
  id-token: write       # build provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

jobs:
  release:
    name: signed foss release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and guard release identity
        id: identity
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "✗ tag must start with 'v': $TAG"; exit 1 ;;
          esac

          VERSION="$(sed -nE 's/^versionName=//p' version.properties)"
          CODE="$(sed -nE 's/^versionCode=//p' version.properties)"
          [ -n "$VERSION" ] && [ -n "$CODE" ] || { echo "✗ version.properties incomplete"; exit 1; }

          if [ "$TAG" != "v$VERSION" ]; then
            echo "✗ tag $TAG does not match version.properties ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # versionCode must increase forever, even across withdrawn releases.
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            PREV_CODE="$(git show "$PREV_TAG:version.properties" | sed -nE 's/^versionCode=//p')"
            if [ -n "$PREV_CODE" ] && [ "$CODE" -le "$PREV_CODE" ]; then
              echo "✗ versionCode $CODE is not greater than $PREV_TAG ($PREV_CODE)"
              exit 1
            fi
            echo "✓ versionCode $CODE > $PREV_CODE ($PREV_TAG)"
          fi

          # Reproducibility: pin the build clock to the commit.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          # setup-android splits this on whitespace: keep it on one line.
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Fail on a missing signing key (never ship unsigned)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "✗ release secrets missing:$missing"
            echo "  An unsigned APK is not a release. Add the secrets and re-run."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/tlc-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          [ -s "$KEYSTORE" ] || { echo "✗ keystore decoded to an empty file"; exit 1; }
          echo "TLC_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          {
            echo "TLC_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "TLC_KEY_ALIAS=$KEY_ALIAS"
            echo "TLC_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Core invariants
        run: ./gradlew verify --console=plain

      - name: Copy lint (no banned user-facing terms)
        run: python3 scripts/copy-lint.py

      - name: FOSS guard (no Play Services / Firebase / tracking)
        run: ./scripts/check-foss.sh

      - name: Relay tests
        run: |
          cd relay
          npm ci --no-audit --no-fund
          npm test

      - name: Peer companion tests
        run: |
          cd peer
          npm ci --no-audit --no-fund
          npm test

      - name: Assemble signed release APK
        run: ./gradlew :apps:android:assembleFossRelease --console=plain

      - name: Verify the binary, then pack assets
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.identity.outputs.version }}"
          APK="$(find apps/android/build/outputs/apk/foss/release -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "✗ no APK produced"; exit 1; }

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          if grep -qi 'does not verify' apksigner.txt; then
            echo "✗ APK signature did not verify"
            exit 1
          fi

          # The certificate is pinned in release-key.properties. A valid signature from the wrong
          # key is still not a TLC release: it would split updates across two signing identities.
          EXPECTED="$(sed -nE 's/^certificateSha256=//p' release-key.properties | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          # apksigner changed its wording between build-tools versions ("Signer #1 certificate
          # SHA-256 digest" vs "V2 Signer: certificate SHA-256 digest"), so match the tail.
          ACTUAL="$(grep -oiE 'certificate SHA-256 digest:[[:space:]]*[0-9a-f]{64}' apksigner.txt | head -1 | grep -oiE '[0-9a-f]{64}$' | tr 'A-F' 'a-f')"
          [ -n "$EXPECTED" ] && [ -n "$ACTUAL" ] || { echo "✗ could not read a certificate fingerprint"; exit 1; }
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "✗ signed by the wrong certificate — refusing to publish"
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi
          echo "✓ certificate $ACTUAL matches release-key.properties"

          # v0.0.8 ships the shared plane, so the binary must request INTERNET and must not opt
          # into cleartext. Capture output first: a piped `if cmd | grep` treats a broken aapt2 as a pass.
          PERMS="$("$BUILD_TOOLS/aapt2" dump permissions "$APK")" || {
            echo "✗ aapt2 could not read the manifest"; exit 1;
          }
          if ! grep -qi 'android.permission.INTERNET' <<<"$PERMS"; then
            echo "✗ the shared plane is enabled but the APK does not request INTERNET"
            echo "  The relay, presence and E2EE messaging cannot work without it."
            echo "$PERMS"
            exit 1
          fi
          echo "✓ INTERNET permission present"

          # Live traffic must only ever go over TLS. Reject a manifest that opts into cleartext
          # or drops the network security config.
          MANIFEST="$("$BUILD_TOOLS/aapt2" dump xmltree "$APK" --file AndroidManifest.xml)" || {
            echo "✗ aapt2 could not read AndroidManifest.xml"; exit 1;
          }
          CLEARTEXT="$(grep -i 'usesCleartextTraffic' <<<"$MANIFEST" || true)"
          if grep -qiE '0xffffffff|true' <<<"$CLEARTEXT"; then
            echo "✗ the manifest sets usesCleartextTraffic=true — relay traffic would be plaintext"
            echo "$CLEARTEXT"
            exit 1
          fi
          if ! grep -qi 'networkSecurityConfig' <<<"$MANIFEST"; then
            echo "✗ the manifest is missing android:networkSecurityConfig"
            exit 1
          fi
          echo "✓ cleartext disabled, network security config present"

          # A dependency-graph check can be satisfied while classes still arrive in the dex.
          unzip -l "$APK" | grep -qE 'classes[0-9]*\.dex' || {
            echo "✗ the APK contains no dex — this is not a runnable app"; exit 1;
          }
          GMS_HITS="$(unzip -p "$APK" 'classes*.dex' | grep -ac 'com/google/android/gms' || true)"
          if [ "${GMS_HITS:-0}" -gt 0 ]; then
            echo "✗ proprietary Play Services classes found inside the dex"
            exit 1
          fi
          echo "✓ no Play Services classes in the dex"

          ASSET="tlc-$VERSION-foss.apk"
          cp "$APK" "$ASSET"

          # Dependency manifest: exactly what went into this binary.
          ./gradlew :apps:android:dependencies \
            --configuration fossReleaseRuntimeClasspath --console=plain \
            > "tlc-$VERSION-foss.dependencies.txt"

          # What a user needs in order to check the download by hand.
          {
            echo "TLC $VERSION"
            echo "commit: $GITHUB_SHA"
            echo "apk: $ASSET"
            echo "applicationId: culture.thelove.tlc"
            echo "versionCode: ${{ steps.identity.outputs.code }}"
            echo "signature schemes: $(grep -oiE 'Verified using v[0-9.]+ scheme[^:]*: true' apksigner.txt | sed -E 's/Verified using (v[0-9.]+) scheme.*/\1/' | tr '\n' ' ')"
            echo "certificate:"
            grep -iE 'certificate (DN|SHA-256)' apksigner.txt | sed -E 's/^[A-Za-z0-9 #.:]+certificate/certificate/' || true
            echo "certificateSha256: $ACTUAL"
          } > "tlc-$VERSION-foss.signature.txt"

          sha256sum \
            "$ASSET" \
            "tlc-$VERSION-foss.dependencies.txt" \
            "tlc-$VERSION-foss.signature.txt" > SHA256SUMS

          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ASSET" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.asset }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.identity.outputs.tag }}"
          VERSION="${{ steps.identity.outputs.version }}"
          ASSET="${{ steps.pack.outputs.asset }}"

          # Immutable assets: never overwrite a published version, withdraw and bump instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✗ release $TAG already exists — assets are immutable. Bump the version."
            exit 1
          fi

          # Notes live in the repository, next to the commit they describe, so they are reviewable.
          NOTES="release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "✗ $NOTES missing — every release needs human-written notes"; exit 1; }

          {
            cat "$NOTES"
            echo
            echo "---"
            echo
            echo "### Verify this download"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "apksigner verify --print-certs $ASSET   # certificate SHA-256 must be:"
            echo "${{ steps.pack.outputs.cert }}"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| APK SHA-256 | \`${{ steps.pack.outputs.sha256 }}\` |"
            echo "| Signing certificate SHA-256 | \`${{ steps.pack.outputs.cert }}\` |"
            echo "| versionCode | \`${{ steps.identity.outputs.code }}\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Provenance | \`gh attestation verify $ASSET --repo $GITHUB_REPOSITORY\` |"
          } > notes.md

          gh release create "$TAG" \
            --verify-tag \
            --title "TLC $VERSION" \
            --latest \
            --notes-file notes.md \
            "$ASSET" \
            "tlc-$VERSION-foss.dependencies.txt" \
            "tlc-$VERSION-foss.signature.txt" \
            SHA256SUMS

      - name: Summary
        if: always()
        run: |
          {
            echo "## TLC ${{ steps.identity.outputs.version }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ steps.identity.outputs.tag }}\` |"
            echo "| versionCode | \`${{ steps.identity.outputs.code }}\` |"
            echo "| Asset | \`${{ steps.pack.outputs.asset }}\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo
            echo "Next: submit the same signed APK to F-Droid (or let the fixture build it) and Orion Store."
          } >> "$GITHUB_STEP_SUMMARY"
