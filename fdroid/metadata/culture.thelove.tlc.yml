Name: TLC
Summary: A tamper-evident record of recognition, not money
Description: |
  TLC records recognition — who showed up for whom — in a log that cannot be quietly rewritten.

  This is a preview build. It walks the activation flow (get details, bring back proof, receive an
  attestation, reach a receipt), decides every step with the same rules the unit tests cover, and
  shows a hash-chained ledger in which each entry carries the hash of the one before it. The flow
  uses demonstration data and the ledger is held in memory for the session; records are not yet
  kept between launches.

  TLC never holds, moves, pools or escrows money. There is no wallet, no balance, no payment rail
  and no card data. The app shows where to send a payment and records the evidence you bring back;
  the transfer itself happens bank to bank between two private accounts. Recognition tokens are
  signals of appreciation — not currency, not transferable, not redeemable, not crypto.

  The build contains no networking code and its APK does not request the INTERNET permission. It
  contains no Google Play Services, no Firebase, no analytics and no proprietary SDK.

  The record is append-only and hash-chained, and the same verification is available outside the
  app through the ledger-verify command-line tool in the source repository.

