Name: TLC
Summary: A tamper-evident record of recognition, not money
Description: |
  TLC records recognition — who showed up for whom, and what they did — in a record that cannot be
  quietly rewritten, and that survives closing the app.

  Entries are kept in a readable text file inside the app's private folder and flushed to disk before
  the app says they were kept. Every launch re-verifies the whole hash chain before adding anything:
  each entry carries the SHA-256 hash of the one before it. A tail lost on the device is reported as
  missing entries; an edited line is reported as a failed verification. A record that does not verify
  opens read-only, and an interrupted write is repaired by dropping only the incomplete line.

  The journal can be searched, any entry opened to see its Merkle proof against the current root, a
  seal (length, head, root, time) shared, and the whole record exported through the system file picker
  in the exact format the ledger-verify command-line tool reads.

  The shell now covers the whole product shape: onboarding and a local profile, Today, Record,
  Growth Grants with evidence and witness stages, Pioneer's Token that stops at proof submission, a
  two-seat Circle with two-key decisions, preferences, verified backup and restore, and an About
  screen. These are local personas and local records, not accounts or sync. A damaged state file or
  backup bundle is refused rather than silently replaced or merged.

  v0.0.5 adds trust and contact: @handles for people and reserved roles, a local address book, an
  encrypted bank vault that saves a destination once and reveals the full number only on purpose,
  Send Support, and a purpose-first Pioneer Desk. The vault uses AES-256-GCM with a key held by the
  Android Keystore. Only the bank name, the last four digits and a fingerprint enter the state; the
  full account number never enters the record, a backup or a log.

  v0.0.6 adds Tokens, receipts and profile photos. One Tokens surface shows every Support, Pioneer's
  Token and Growth Grant with its live state, honest timeline and receipt, and three counters
  describe circulation without a balance or a ranking. Receipt images are downscaled, stripped of
  metadata and kept in app-private storage; the state and the record carry a file name and a
  fingerprint, never the bytes. Visibility is explicit and revocable, and sharing is a user action
  through the system chooser. Profile photos can be picked, replaced or removed. Everything remains
  local-only: the Received view shows what is on this device and does not invent a number.

  v0.0.7 adds the door, the face and the route. A distinct username and a word/phrase passphrase
  open the circle; a salted PBKDF2 verifier stays on the device and the passphrase itself is never
  stored, logged or sent. There is no fingerprint, face, passkey or device-credential unlock
  anywhere; the passphrase is the only door, and a build gate fails on any biometric or passkey API.
  An avatar studio frames a photo with drag, pinch and zoom before saving the exact circle shown; a
  profile hero, ringed avatar and initials monogram replace the previous layout. Presence is four
  independent choices — online now, last seen, typing and read receipts — each starting at Nobody,
  with invisible, selected and hidden people, coarse last seen and a live preview. A token transfer
  now asks for the real Transfer Method: provider, fee, who pays, arrival, limit and availability,
  with a two-minute held window and honest disabled states for routes this build cannot reach. TLC
  still never holds, moves, pools or escrows money, and completes nothing on the person's behalf.
  Presence choices are stored on this device and are the instruction the shared plane must obey;
  there is still no server account, sync, multi-device merge or INTERNET permission.

  v0.0.8 adds the shared plane. A fifth Live tab connects to a thin, self-hostable TLC relay for
  one-to-one messages and presence. Messages are sealed on the device with P-256 ECDH, HKDF-SHA256
  and AES-256-GCM with a SHA256withECDSA sender signature; the relay stores ciphertext, a
  conversation id, timing and size, never plaintext. This composes audited JCA primitives directly
  and is labelled E2EE alpha, not a formally audited ratchet. Presence is filtered on the relay
  against a consent record: online now, last seen, typing and read receipts each have an audience,
  and a hidden signal is sent as "not shared", never guessed as offline. An account can be deleted
  from the app, which removes its connections and queued ciphertext; undelivered ciphertext is
  pruned at 30 days. A companion Pear/Holepunch node replicates a record-shape-only handoff over
  Hyperswarm and never receives subjects, amounts, photos, receipts or vault fields. The private
  record, vault, drafts and images still work in airplane mode.

  TLC never holds, moves, pools or escrows money. There is no wallet, no balance, no payment rail
  and no card data. The app shows where to send a payment and records the evidence you bring back;
  the transfer itself happens bank to bank between two private accounts. Recognition tokens are
  signals of appreciation — not currency, not transferable, not redeemable, not crypto.

  The APK requests INTERNET and ACCESS_NETWORK_STATE for the relay only; it requests no storage,
  contacts, location, camera or microphone permission. Cleartext HTTP is disabled and a network
  security config pins TLS. It contains no Google Play Services, no Firebase, no analytics and no
  proprietary SDK.

  The record is append-only and hash-chained, and the same verification is available outside the
  app through the ledger-verify command-line tool in the source repository.

