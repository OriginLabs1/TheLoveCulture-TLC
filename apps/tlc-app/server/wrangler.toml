name = "union-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# The relay is optional. Union works fully offline without it; a relay only
# adds store-and-forward delivery, a handle directory and shared public rooms.

[[d1_databases]]
binding = "DB"
database_name = "union-relay"
database_id = "5994448e-1e86-4c38-8867-d11189898670"

[vars]
# Browser origins allowed to call the relay. Union works without the relay.
ALLOWED_ORIGINS = "https://union.cculture.net,https://union-app.cculture.net,https://union-app-9ni.pages.dev"

[[routes]]
# A stable, first-party endpoint for the optional relay.
pattern = "union-relay.cculture.net"
custom_domain = true

[observability]
enabled = true

[triggers]
# Daily retention: acked mail after a day, anything after 30 days.
crons = ["17 3 * * *"]
